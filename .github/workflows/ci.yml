name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0

      - name: go build
        run: go build -o /tmp/jdt .
